# Environment Configuration for easemyresearch.com Test Framework

environments:
  # Development Environment
  development:
    app:
      base_url: "https://dev.easemyresearch.com"
      api_base_url: "https://dev.easemyresearch.com/api"
      database_url: "postgresql://dev_user:dev_pass@dev-db:5432/easemyresearch_dev"
    features:
      debug_mode: true
      verbose_logging: true
      performance_testing: false
      security_testing: true
    credentials:
      admin_user: "dev_admin@easemyresearch.com"
      admin_password: "DevAdmin123!"
      test_user: "dev_test@easemyresearch.com"
      test_password: "DevTest123!"
    timeouts:
      page_load: 60
      api_response: 45
      
  # Staging Environment
  staging:
    app:
      base_url: "https://staging.easemyresearch.com"
      api_base_url: "https://staging.easemyresearch.com/api"
      database_url: "postgresql://staging_user:staging_pass@staging-db:5432/easemyresearch_staging"
    features:
      debug_mode: false
      verbose_logging: false
      performance_testing: true
      security_testing: true
    credentials:
      admin_user: "staging_admin@easemyresearch.com"
      admin_password: "StagingAdmin123!"
      test_user: "staging_test@easemyresearch.com"
      test_password: "StagingTest123!"
    timeouts:
      page_load: 30
      api_response: 30
      
  # Production Environment
  production:
    app:
      base_url: "https://easemyresearch.com"
      api_base_url: "https://easemyresearch.com/api"
      database_url: "postgresql://prod_readonly:prod_pass@prod-db:5432/easemyresearch_prod"
    features:
      debug_mode: false
      verbose_logging: false
      performance_testing: false  # Limited performance testing on prod
      security_testing: false     # No penetration testing on prod
      smoke_testing_only: true
    credentials:
      # Use environment variables for production credentials
      admin_user: "${PROD_ADMIN_USER}"
      admin_password: "${PROD_ADMIN_PASSWORD}"
      test_user: "${PROD_TEST_USER}"
      test_password: "${PROD_TEST_PASSWORD}"
    timeouts:
      page_load: 15
      api_response: 15
    restrictions:
      read_only: true
      no_data_modification: true
      limited_test_scope: true
      
  # QA Environment
  qa:
    app:
      base_url: "https://qa.easemyresearch.com"
      api_base_url: "https://qa.easemyresearch.com/api"
      database_url: "postgresql://qa_user:qa_pass@qa-db:5432/easemyresearch_qa"
    features:
      debug_mode: false
      verbose_logging: true
      performance_testing: true
      security_testing: true
      accessibility_testing: true
    credentials:
      admin_user: "qa_admin@easemyresearch.com"
      admin_password: "QaAdmin123!"
      test_user: "qa_test@easemyresearch.com"
      test_password: "QaTest123!"
    timeouts:
      page_load: 30
      api_response: 30
    test_data:
      reset_after_suite: true
      use_fresh_data: true
      
  # Local Environment
  local:
    app:
      base_url: "http://localhost:3000"
      api_base_url: "http://localhost:3001/api"
      database_url: "sqlite:///./local_test.db"
    features:
      debug_mode: true
      verbose_logging: true
      performance_testing: false
      security_testing: false
    credentials:
      admin_user: "admin@localhost"
      admin_password: "LocalAdmin123!"
      test_user: "test@localhost"
      test_password: "LocalTest123!"
    timeouts:
      page_load: 60
      api_response: 60
    docker:
      enabled: true
      compose_file: "docker-compose.test.yml"
      
# Default environment if not specified
default_environment: "development"

# Environment-specific browser configurations
browser_configs:
  development:
    headless: false
    video_recording: true
    screenshots: true
  staging:
    headless: false
    video_recording: true
    screenshots: true
  production:
    headless: true
    video_recording: false
    screenshots: false
  qa:
    headless: false
    video_recording: true
    screenshots: true
  local:
    headless: false
    video_recording: false
    screenshots: true