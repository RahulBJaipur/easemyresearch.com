# Test Configuration for easemyresearch.com Test Framework

# Application Under Test
app:
  name: "EaseMyResearch"
  base_url: "https://easemyresearch.com"
  api_base_url: "https://easemyresearch.com/api"
  
# Browser Configuration
browser:
  default: "chrome"
  headless: false
  window_size: "1920,1080"
  page_load_timeout: 30
  implicit_wait: 10
  explicit_wait: 20
  supported_browsers:
    - chrome
    - firefox
    - edge
    - safari

# Test Execution Settings
execution:
  parallel_workers: 4
  retry_failed_tests: 2
  capture_screenshots: true
  video_recording: false
  test_data_cleanup: true
  
# Reporting Configuration
reporting:
  html_report: true
  allure_report: true
  json_report: true
  screenshot_on_failure: true
  log_level: "INFO"
  report_directory: "./reports"
  
# Performance Testing
performance:
  load_test:
    users: 100
    spawn_rate: 10
    run_time: "5m"
  stress_test:
    users: 500
    spawn_rate: 50
    run_time: "10m"
  volume_test:
    users: 1000
    spawn_rate: 100
    run_time: "15m"
    
# Security Testing
security:
  sql_injection_payloads: "./fixtures/sql_injection_payloads.txt"
  xss_payloads: "./fixtures/xss_payloads.txt"
  csrf_protection: true
  https_enforcement: true
  
# Accessibility Testing
accessibility:
  wcag_level: "AA"
  wcag_version: "2.1"
  check_color_contrast: true
  check_keyboard_navigation: true
  
# API Testing
api:
  timeout: 30
  max_retries: 3
  verify_ssl: true
  response_format: "json"
  rate_limit_delay: 1
  
# Test Data
test_data:
  use_faker: true
  cleanup_after_test: true
  database_reset: false
  test_users:
    valid_user: "test_user@example.com"
    admin_user: "admin@example.com"
    
# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/test_execution.log"
  console_output: true
  
# Email Testing
email:
  smtp_server: "localhost"
  smtp_port: 1025
  test_email_domain: "test.com"
  
# Database
database:
  test_db_url: "sqlite:///./test_data.db"
  cleanup_strategy: "rollback"
  
# CI/CD Integration
ci_cd:
  jenkins_integration: true
  github_actions: true
  slack_notifications: true
  slack_webhook: ""
  
# Feature Flags
features:
  mobile_testing: true
  api_testing: true
  performance_testing: true
  security_testing: true
  accessibility_testing: true
  visual_regression_testing: false