version: '3.8'

services:
  test-framework:
    build: .
    container_name: easemyresearch-tests
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    environment:
      - ENVIRONMENT=development
      - BROWSER=chrome
      - HEADLESS=true
    command: python run_tests.py --test-type smoke --headless
    
  performance-tests:
    build: .
    container_name: easemyresearch-performance
    volumes:
      - ./reports:/app/reports
    environment:
      - ENVIRONMENT=staging
    command: python run_tests.py performance-tests --users 50 --duration 3m
    
  security-tests:
    build: .
    container_name: easemyresearch-security
    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
    environment:
      - ENVIRONMENT=development
    command: python run_tests.py security-tests
