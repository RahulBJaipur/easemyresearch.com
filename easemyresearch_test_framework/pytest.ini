[tool:pytest]
# Basic configuration
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    smoke: Smoke tests for basic functionality
    regression: Regression tests for existing features
    functional: Functional tests for specific features
    ui: User interface tests
    api: API tests
    integration: Integration tests
    performance: Performance tests
    security: Security tests
    accessibility: Accessibility tests
    usability: Usability tests
    compatibility: Browser/device compatibility tests
    slow: Slow running tests
    fast: Fast running tests
    critical: Critical path tests
    high: High priority tests
    medium: Medium priority tests
    low: Low priority tests
    authentication: Authentication related tests
    search: Search functionality tests
    user_management: User management tests
    data_validation: Data validation tests
    error_handling: Error handling tests
    edge_cases: Edge case tests
    boundary: Boundary value tests

# Test execution options
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --html=reports/test_report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --cov=.
    --cov-report=html:reports/coverage_html
    --cov-report=xml:reports/coverage.xml
    --cov-report=term-missing
    --cov-fail-under=80
    --maxfail=10
    --reruns=2
    --reruns-delay=1

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Test discovery
collect_ignore = [
    "setup.py",
    "conftest.py"
]

# Timeout settings
timeout = 300
timeout_method = thread

# Warnings configuration
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:selenium.*
    ignore::UserWarning:urllib3.*

# Parallel execution
xfail_strict = true

# Custom options
junit_family = xunit2
junit_suite_name = EaseMyResearch Test Suite
junit_logging = all
junit_log_passing_tests = true